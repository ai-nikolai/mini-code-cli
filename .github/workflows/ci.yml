name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ``requires-python = ">=3.10"`` and the classifiers promise 3.10-3.13,
        # so the oldest and the newest supported interpreter are both exercised:
        # 3.10 is the only one without ``tomllib``, i.e. the only one that runs
        # the regex fallbacks in ``__init__`` and ``scripts/push_version_tag.py``.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .

      - name: Lint
        run: python scripts/lint.py

      - name: Test the CLI
        run: python -m unittest discover -s tests -p "test_*.py"

      # The benchmark harness is a separate, dependency-free package: its tests
      # need neither a dataset nor a container, so CI runs them like the CLI's.
      - name: Test the benchmark harness
        run: python -m unittest discover -s benchmarks/tests -t . -p "test_*.py"

      # The renamed entry point is the command the docs promise; --help proves it
      # imports (and therefore that nothing it needs was left behind in the move).
      - name: Smoke-test the benchmark entry point
        run: python benchmarks/run_benchmarks.py --help

  packaging:
    # Build the distributions on every push so a packaging break (a module left
    # out of the wheel, broken metadata, a missing asset) shows up here rather
    # than in the release workflow, i.e. after the tag already exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the distributions are PyPI/twine ready
        run: python -m twine check dist/*
