name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ``requires-python = ">=3.10"`` and the classifiers promise 3.10-3.13,
        # so the oldest and the newest supported interpreter are both exercised:
        # 3.10 is the only one without ``tomllib``, i.e. the only one that runs
        # the regex fallbacks in ``__init__`` and ``scripts/push_version_tag.py``.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .

      - name: Lint
        run: python scripts/lint.py

      - name: Test
        run: python -m unittest discover -s tests -p "test_*.py"

  shared-3.12:
    # The claim the README makes: mini-code and harbor can share one environment
    # on 3.12. harbor (the Terminal-Bench harness) requires >= 3.12, so this is
    # the only job where both are installed side by side -- a dependency clash
    # (requests, pydantic, httpx) or a namespace collision would surface here
    # rather than on a user's machine. Kept to the published harbor release so
    # the job does not depend on a git branch of ours.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mini-code-cli and harbor together
        run: |
          python -m pip install --upgrade pip
          pip install "harbor>=0.24"
          pip install -e .

      - name: Both import, and the console script runs
        run: |
          python -c "import mini_code_cli, harbor; print(mini_code_cli.__file__, harbor.__file__)"
          mini-code --help > /dev/null

  packaging:
    # Build the distributions on every push so a packaging break (a module left
    # out of the wheel, broken metadata, a missing asset) shows up here rather
    # than in the release workflow, i.e. after the tag already exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the distributions are PyPI/twine ready
        run: python -m twine check dist/*
