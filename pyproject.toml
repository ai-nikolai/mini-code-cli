[project]
name = "mini-code-cli"
# version = { file = "mini_code_cli/__init__.py", attr = "__version__" }
version = "0.1.1.2"
description = "Mini Coding Agent. Allows you to easily experiment with a small coding agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3"
]
authors = [
    {name = "Nikolai Rozanov", email = "nikolai.rozanov@gmail.com"},
]
# SPDX expression + explicit licence file (PEP 639). The licence is the
# AGPL-3.0 text in LICENSE; "-only" because the project does not state
# "or any later version" anywhere. Needs setuptools >= 77 below.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
urls = {"Homepage" = "https://github.com/ai-nikolai/mini-code-cli"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mini_code_cli*"]

[project.scripts]
mini-code = "mini_code_cli.agent_loop:main"

