[project]
name = "mini-code-cli"
# version = { file = "mini_code_cli/__init__.py", attr = "__version__" }
version = "0.1.1.0"
description = "Mini Coding Agent. Allows you to easily experiment with a small coding agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3"
]
authors = [
    {name = "Nikolai Rozanov", email = "nikolai.rozanov@gmail.com"},
]
license = {file = "LICENSE"}
urls = {"Homepage" = "https://github.com/ai-nikolai/mini-code-cli"}


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mini_code_cli*"]

[project.scripts]
mini-code = "mini_code_cli.agent_loop:main"

