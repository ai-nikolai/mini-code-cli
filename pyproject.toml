[project]
name = "mini-code-cli"
# version = { file = "mini_code_cli/__init__.py", attr = "__version__" }
version = "0.0.8.2"
description = "Minimal Coding CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
]
authors = [
    {name = "Nikolai Rozanov", email = "nikolai.rozanov@gmail.com"},
]
license = {file = "LICENSE"}
urls = {"Homepage" = "https://github.com/ai-nikolai/mini-code-cli"}


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mini_code_cli"]

[dependency-groups]
dev = [
    "harbor[daytona]>=0.20.0 ; python_full_version >= '3.12'",
]

[project.scripts]
mini-code = "mini_code_cli.agent_loop:main"
